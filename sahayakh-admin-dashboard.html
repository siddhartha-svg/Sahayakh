<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Sahayakh Admin - Dashboard Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --page:#F1F5F2; --surface:#FFFFFF; --surface-2:#F5F8F6; --ink:#0E2217; --muted:#57675E; --line:#E0E8E2;
  --brand:#1B7A3E; --brand-deep:#0F4D28; --brand-soft:#E3F3E8; --brand-text:#17703A;
  --biz:#1D58BD; --biz-soft:#E2ECFA; --biz-text:#1D58BD;
  --ok-soft:#E3F3E8; --ok-ink:#17703A; --info-soft:#E2ECFA; --info-ink:#1D58BD;
  --warn-soft:#FFF1D0; --warn-ink:#8A5A0B; --bad:#C0392B; --bad-soft:#FBE6E3; --bad-ink:#B3311F;
  --mute-soft:#EBEFEC; --mute-ink:#5A6A61; --star:#F2A20C;
  --side:#0F4D28; --side-2:rgba(255,255,255,.1); --side-3:rgba(255,255,255,.16);
  --shadow:0 1px 2px rgba(14,34,23,.05),0 4px 14px rgba(14,34,23,.05);
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --page:#080D0A; --surface:#111A15; --surface-2:#18231D; --ink:#EAF3ED; --muted:#9AAAA1; --line:#25332A;
    --brand-soft:#173323; --brand-text:#5FD08D; --biz-soft:#15294A; --biz-text:#86B2FF;
    --ok-soft:#173323; --ok-ink:#5FD08D; --info-soft:#15294A; --info-ink:#86B2FF;
    --warn-soft:#3A2C10; --warn-ink:#F1C56E; --bad-soft:#3B1B18; --bad-ink:#F08A7E;
    --mute-soft:#202C25; --mute-ink:#9AAAA1; --side:#0B2D18;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --page:#080D0A; --surface:#111A15; --surface-2:#18231D; --ink:#EAF3ED; --muted:#9AAAA1; --line:#25332A;
  --brand-soft:#173323; --brand-text:#5FD08D; --biz-soft:#15294A; --biz-text:#86B2FF;
  --ok-soft:#173323; --ok-ink:#5FD08D; --info-soft:#15294A; --info-ink:#86B2FF;
  --warn-soft:#3A2C10; --warn-ink:#F1C56E; --bad-soft:#3B1B18; --bad-ink:#F08A7E;
  --mute-soft:#202C25; --mute-ink:#9AAAA1; --side:#0B2D18;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.25);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--page);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
button:disabled{cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brand-text);outline-offset:2px}
h1,h2,h3,p{margin:0}
.ic{flex:none;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}

/* ---------- app shell ---------- */
.app{height:100%;display:grid;grid-template-columns:252px 1fr;overflow:hidden}
.side{background:var(--side);color:#fff;display:flex;flex-direction:column;padding:18px 14px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px}
.brand b{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.brand span{font-size:11.5px;opacity:.75}
.nav{display:flex;flex-direction:column;gap:4px}
.nv{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;font-weight:600;font-size:14px;color:rgba(255,255,255,.82);width:100%}
.nv:hover{background:var(--side-2)}
.nv[aria-current="page"]{background:var(--side-3);color:#fff}
.nv .n{margin-left:auto;background:#F2A20C;color:#2a1a00;font-size:11.5px;font-weight:800;border-radius:99px;padding:1px 8px}
.nv:focus-visible{outline-color:#fff}
.side-foot{margin-top:auto;padding:14px 8px 2px;display:flex;align-items:center;gap:10px;border-top:1px solid var(--side-2)}
.side-foot b{display:block;font-size:13.5px}
.side-foot span{font-size:12px;opacity:.75}
.main{display:flex;flex-direction:column;min-width:0;overflow-y:auto;overscroll-behavior:contain}
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 24px;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .sp{flex:1}
.bar .ham{display:none}
.bar .mb{display:none;font-weight:800;font-size:17px;color:var(--brand-text);letter-spacing:-.02em}
.city{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid var(--line);border-radius:99px;font-weight:600;font-size:13px;background:var(--surface-2)}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;position:relative}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn .dot{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--bad);border:2px solid var(--surface)}
.page{padding:24px;max-width:1240px;width:100%;margin:0 auto}
.scrim{position:fixed;inset:0;background:rgba(6,14,10,.5);z-index:40;opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s linear .2s}
.scrim.on{opacity:1;visibility:visible;transition-delay:0s}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;z-index:50;top:0;bottom:0;left:0;width:272px;transform:translateX(-100%);transition:transform .25s;padding-top:calc(18px + env(safe-area-inset-top,0px))}
  .side.on{transform:none}
  .bar{padding:8px 14px}
  .bar .ham{display:grid}
  .bar .mb{display:block}
  .city{display:none}
  .page{padding:16px 14px 28px}
}

/* ---------- shared ---------- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
.ph p{color:var(--muted);margin-top:2px}
.ph-a{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.card h2{font-size:15.5px;font-weight:800;letter-spacing:-.01em}
.card .ch{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 16px;border-radius:12px;font-weight:700;font-size:14px;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--brand);color:#fff}
.btn-outline{border:1.5px solid var(--brand);color:var(--brand-text)}
.btn-danger{border:1.5px solid var(--bad);color:var(--bad-ink)}
.btn-soft{background:var(--surface-2);border:1px solid var(--line)}
.btn-sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.btn-block{display:flex;width:100%}
.btn:disabled{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok-ink)}
.pill.info{background:var(--info-soft);color:var(--info-ink)}
.pill.warn{background:var(--warn-soft);color:var(--warn-ink)}
.pill.bad{background:var(--bad-soft);color:var(--bad-ink)}
.pill.mute{background:var(--mute-soft);color:var(--mute-ink)}
.tp{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px}
.tp.p{background:var(--brand-soft);color:var(--brand-text)}
.tp.b{background:var(--biz-soft);color:var(--biz-text)}
.av{border-radius:50%;overflow:hidden;flex:none;display:block}
.ini{display:grid;place-items:center;border-radius:50%;background:var(--brand-soft);color:var(--brand-text);font-weight:800;flex:none}
.seg{display:inline-flex;padding:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;gap:2px}
.seg button{height:34px;padding:0 14px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--brand);color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:7px 13px;border-radius:99px;border:1px solid var(--line);font-size:13px;font-weight:600;background:var(--surface)}
.chip[aria-pressed="true"],.chip[aria-checked="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-text)}
.inp{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;min-height:42px;background:var(--surface)}
.inp:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.inp input,.inp select,.inp textarea{flex:1;min-width:0;width:100%;border:0;outline:0;background:transparent;font:inherit;color:inherit;padding:10px 0}
.inp textarea{resize:vertical;min-height:70px}
.inp .pre{color:var(--muted);font-weight:700}
.inp select{color-scheme:light dark}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tools .inp{flex:1 1 220px;max-width:340px}
.count{color:var(--muted);font-size:13px;margin-left:auto}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:2px}
.bar-track{height:7px;border-radius:99px;background:var(--line);overflow:hidden}
.bar-track i{display:block;height:100%;border-radius:99px;background:var(--brand)}

/* ---------- overview ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{padding:16px}
.kpi .k-h{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:13px;font-weight:600}
.kpi .k-i{width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
.kpi .k-v{display:block;font-size:30px;font-weight:800;letter-spacing:-.03em;margin:8px 0 2px;line-height:1.1}
.kpi .k-d{font-size:12.5px;font-weight:700;color:var(--ok-ink)}
.kpi .k-d.neg{color:var(--bad-ink)}
.kpi .k-d span{color:var(--muted);font-weight:500}
.t-g{background:var(--brand-soft);color:var(--brand-text)}
.t-b{background:var(--biz-soft);color:var(--biz-text)}
.t-a{background:var(--warn-soft);color:var(--warn-ink)}
.t-r{background:var(--bad-soft);color:var(--bad-ink)}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}
.mini{display:flex;align-items:center;gap:12px;padding:12px 16px}
.mini b{display:block;font-size:19px;font-weight:800;letter-spacing:-.02em}
.mini span{font-size:12.5px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:14px;margin-top:14px}
.grid3{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:14px;margin-top:14px}
.chart{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;align-items:end;height:220px}
.chart .col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
.chart .stk{display:flex;flex-direction:column;width:100%;max-width:38px}
.chart .stk i{display:block;width:100%}
.chart .stk .b{background:var(--biz);border-radius:8px 8px 0 0}
.chart .stk .p{background:var(--brand);border-radius:0 0 4px 4px}
.chart small{font-size:11.5px;color:var(--ink);font-weight:700}
.chart .today span{color:var(--ink)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.attn{display:flex;flex-direction:column;gap:8px}
.at{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.at:hover{background:var(--surface-2)}
.at .k-i{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.at b{display:block;font-size:14px}
.at small{color:var(--muted);font-size:12.5px}
.at .num{margin-left:auto;font-size:20px;font-weight:800;letter-spacing:-.02em}
.feed{display:flex;flex-direction:column}
.fe{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.fe:last-child{border-bottom:0}
.fe .k-i{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none}
.fe small{display:block;color:var(--muted);font-size:12px}
.fe.new{animation:fadein .5s}
.cat{display:flex;flex-direction:column;gap:12px}
.cat .r{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13.5px}
.cat .r b{font-weight:700}
.cat .r .bar-track{grid-column:1/-1}
.toph{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.toph:last-child{border-bottom:0}
.toph b{display:block;font-size:14px}
.toph small{color:var(--muted);font-size:12.5px}
.rate{display:inline-flex;align-items:center;gap:4px;font-weight:700}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#22C55E;margin-right:6px;box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:ping 1.8s infinite}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:1fr 1fr}.grid3>:first-child{grid-column:1/-1}}
@media (max-width:900px){.grid2{grid-template-columns:1fr}.minis{grid-template-columns:1fr}.grid3{grid-template-columns:1fr}.kpi .k-v{font-size:26px}}
@media (max-width:420px){.kpis{gap:10px}.kpi{padding:12px}.kpi .k-v{font-size:22px}.kpi .k-h span:first-child{font-size:12px}}

/* ---------- tables ---------- */
.tbl{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.trow{display:grid;grid-template-columns:var(--cols);gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);width:100%;text-align:left}
.trow:first-child{border-top:0}
.thead{font-size:12px;color:var(--muted);font-weight:700;background:var(--surface-2)}
button.trow:hover{background:var(--surface-2)}
.c-main{display:flex;align-items:center;gap:12px;min-width:0}
.c-main b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-main small{display:block;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-main>div{min-width:0}
.money{font-weight:800}
@media (max-width:820px){
  .thead{display:none}
  .trow{display:flex;flex-wrap:wrap;gap:8px 12px;padding:14px}
  .c-main{flex:1 1 100%}
  .hide-sm{display:none!important}
}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:820px){.acts{justify-content:flex-start;flex:1 1 100%}}

/* approvals */
.appgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.appc{display:flex;flex-direction:column;gap:12px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.appc:hover{border-color:var(--brand)}
.appc .top{display:flex;align-items:center;gap:12px}
.appc .top b{display:block;font-size:15px}
.appc .top small{color:var(--muted)}
.appc .pg{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:600}

/* payouts */
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}
.sum .card b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.sum .card span{color:var(--muted);font-size:13px;font-weight:600}
.sum .card small{color:var(--muted);font-size:12.5px}
@media (max-width:700px){.sum{grid-template-columns:1fr}}

/* pricing */
.pgrid{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}
@media (max-width:900px){.pgrid{grid-template-columns:1fr}}
.frm{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
@media (max-width:560px){.frm{grid-template-columns:1fr}}
.frm label>span.l{display:block;font-size:12.5px;font-weight:700;margin-bottom:6px}
.frm label small{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.calc-r{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.calc-r:last-child{border-bottom:0}
.calc-r.big{font-size:18px;font-weight:800}
.calc-r.big b{color:var(--brand-text)}
.dirty{font-size:12.5px;color:var(--warn-ink);font-weight:700}

/* ---------- drawer / modal ---------- */
.dw-wrap{position:fixed;inset:0;z-index:60;background:rgba(6,14,10,.5);opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s linear .2s}
.dw-wrap.on{opacity:1;visibility:visible;transition-delay:0s}
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--surface);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.7,.2,1);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dw-wrap.on .drawer{transform:none}
.dw-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.dw-h h2{font-size:17px;font-weight:800;letter-spacing:-.01em}
.dw-b{flex:1;overflow-y:auto;padding:18px}
.dw-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:10px}
.dw-f .btn{flex:1}
.dw-f .hint{flex:1 1 100%;font-size:12.5px;color:var(--muted);margin:0 0 -2px}
.dw-f.col{flex-wrap:wrap}
.who-h{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.who-h b{display:block;font-size:19px;font-weight:800;letter-spacing:-.02em}
.who-h small{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:14px;margin:12px 0}
.stats div{text-align:center;padding:10px 4px}
.stats div+div{border-left:1px solid var(--line)}
.stats b{display:block;font-size:17px;font-weight:800}
.stats span{font-size:11.5px;color:var(--muted)}
.dl{margin:0}
.kv{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.kv:last-child{border-bottom:0}
.kv dt{color:var(--muted);margin:0;flex:none}
.kv dd{margin:0;font-weight:600;text-align:right}
.lbl{font-size:13px;font-weight:800;margin:20px 0 8px}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:5px 10px;font-size:12.5px;font-weight:600}
.doc{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.doc:last-child{border-bottom:0}
.doc>span:first-child{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);flex:none;color:var(--muted)}
.doc b{display:block;font-size:14px}
.doc .r{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;display:flex;gap:12px;padding:0 0 16px 0;font-size:13.5px}
.tl li::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl i{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;border:2px solid var(--line);background:var(--surface);color:#fff}
.tl li.on i{background:var(--brand);border-color:var(--brand)}
.tl li.bad i{background:var(--bad);border-color:var(--bad)}
.tl small{display:block;color:var(--muted);font-size:12px}
.tl li:not(.on):not(.bad){color:var(--muted)}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;margin-bottom:8px}
.opt[aria-checked="true"]{border-color:var(--brand);background:var(--brand-soft)}
.opt b{display:block;font-size:14px}
.opt small{color:var(--muted);font-size:12.5px}
.rd{width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);flex:none;margin-top:1px}
.opt[aria-checked="true"] .rd{border-color:var(--brand);background:var(--brand);box-shadow:inset 0 0 0 4px var(--surface)}
.msgs{display:flex;flex-direction:column;gap:8px}
.msg{max-width:88%;padding:9px 12px;border-radius:14px;font-size:13.5px;line-height:1.4}
.msg small{display:block;font-weight:700;font-size:11.5px;margin-bottom:2px;opacity:.75}
.msg.a{background:var(--surface-2);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.msg.b{background:var(--info-soft);align-self:flex-end;border-bottom-right-radius:4px}
.thumbs{display:flex;gap:10px}
.thumbs span{width:64px;height:64px;border-radius:12px;display:grid;place-items:center}
.md-wrap{position:fixed;inset:0;z-index:70;background:rgba(6,14,10,.55);display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s linear .2s}
.md-wrap.on{opacity:1;visibility:visible;transition-delay:0s}
.modal{width:min(440px,100%);max-height:90%;overflow:auto;background:var(--surface);border-radius:20px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.35);transform:scale(.97);transition:transform .2s}
.md-wrap.on .modal{transform:none}
.modal h2{font-size:18px;font-weight:800;letter-spacing:-.01em;margin-bottom:6px}
.modal p{color:var(--muted);margin-bottom:12px}
.modal .row-b{display:flex;gap:10px;margin-top:16px}
.modal .row-b .btn{flex:1}
.err{color:var(--bad-ink);font-size:13px;font-weight:600;margin-top:8px;min-height:18px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);background:var(--ink);color:var(--surface);padding:11px 18px;border-radius:99px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:90;max-width:90%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@keyframes fadein{from{opacity:0;transform:translateY(-6px);background:var(--brand-soft)}to{opacity:1;transform:none}}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(34,197,94,.55)}70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

}

   }
   else if(S.resolve==='pay_helper')out='Helper paid, no refund';
   else if(S.resolve==='warn')out='Warning logged for '+d.against;
   else out='Dismissed, no action';
   d.status='resolved';d.res=out;
   if(d.task&&S.tasks.filter(function(t){return t.id===d.task&&t.status==='disputed'})[0])S.tasks.filter(function(t){return t.id===d.task})[0].status='completed';
   closeDw();R.disputes();renderNav();toast(d.id+' resolved');
 },
 /* payouts */
 paynow:function(el){var p=S.payouts.filter(function(x){return x.id===el.dataset.id})[0];p.status='paid';R.payouts();renderNav();toast(rs(p.amt)+' paid to '+p.helper)},
 hold:function(el){toast('Payout put on hold for review')},
 retry:function(el){var p=S.payouts.filter(function(x){return x.id===el.dataset.id})[0];p.status='pending';delete p.why;R.payouts();renderNav();toast('Payout moved back to pending')},
 payall:function(){
   var pend=S.payouts.filter(function(p){return p.status==='pending'}),tot=pend.reduce(function(a,p){return a+p.amt},0);
   modal('<h2>Pay all pending?</h2><p>'+rs(tot)+' will be sent to '+pend.length+' helper'+(pend.length===1?'':'s')+' by UPI or bank transfer.</p><div class="row-b"><button class="btn btn-soft" data-act="closemodal">Cancel</button><button class="btn btn-primary" data-act="dopayall">Pay '+rs(tot)+'</button></div>');
 },
 dopayall:function(){S.payouts.forEach(function(p){if(p.status==='pending')p.status='paid'});closeModal();R.payouts();renderNav();toast('All pending payouts sent')},
 /* pricing */
 saveprice:function(){S.saved=Object.assign({},S.price);paintCalc();toast('Pricing saved. New tasks will use these rates.')},
 resetprice:function(){S.price=Object.assign({},S.saved);R.pricing()},
 ctype:function(el){S.calc.biz=el.dataset.v==='b';$$('#page [data-act="ctype"]').forEach(function(b){b.setAttribute('aria-pressed',String(b===el))});paintCalc()}
};
document.addEventListener('click',function(e){
  if(e.target===$('#scrim')){openNav(false);return}
  if(e.target===$('#dw')){closeDw();return}
  if(e.target===$('#md')){closeModal();return}
  var el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  var f=A[el.dataset.act];if(f)f(el);
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='q'){S.f[S.page].q=t.value;if(S.page==='helpers')paintHelpers();else paintTasks()}
  else if(t.dataset&&t.dataset.price){var v=parseFloat(t.value);S.price[t.dataset.price]=isNaN(v)?0:v;paintCalc()}
  else if(t.id==='cKm'){S.calc.km=Math.max(0,parseFloat(t.value)||0);paintCalc()}
  else if(t.id==='cMin'){S.calc.min=Math.max(0,parseFloat(t.value)||0);paintCalc()}
  else if(t.id==='partAmt'){var n=t.value.replace(/[^0-9]/g,'');if(n!==t.value)t.value=n}
});
document.addEventListener('change',function(e){
  if(e.target.id==='stsel'){S.f.tasks.st=e.target.value;paintTasks()}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){if($('#md').classList.contains('on'))closeModal();else if($('#dw').classList.contains('on'))closeDw();else openNav(false)}
});

/* ---------- live simulation ---------- */
function pushEvent(fresh){
  var ev=makeEvent();ev.fresh=fresh;S.feed.unshift(ev);S.feed=S.feed.slice(0,7);
  var f=$('#feed');if(f)f.innerHTML=feedHTML();
}
setInterval(function(){
  pushEvent(true);
  live.active=Math.max(9,Math.min(22,live.active+(Math.random()>.5?1:-1)));
  live.online=Math.max(38,Math.min(58,live.online+(Math.random()>.5?1:-1)));
  var a=$('#kpi-active'),o=$('#kpi-online');if(a)a.textContent=live.active;if(o)o.textContent=live.online;
},4500);

/* ---------- init ---------- */
$('#hamIc').innerHTML=I('menu',22);$('#cityIc').innerHTML=I('pin',15);$('#bellIc').innerHTML=I('bell',22);
$('#adminAv').innerHTML=avatar(ADMIN,38,'Meena Iyer');
paintTheme();
for(var i=0;i<5;i++)S.feed.push(makeEvent());
setPage('overview');
window.__S=S;window.__A=A;
})();
</script>
