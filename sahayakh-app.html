<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Sahayakh - App Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --page:#E6EEE9; --surface:#FFFFFF; --surface-2:#F3F7F4; --ink:#0E2217; --muted:#57675E; --line:#DFE7E1;
  --brand:#1B7A3E; --brand-deep:#125C2C; --brand-soft:#E3F3E8; --brand-text:#17703A;
  --biz:#1D58BD; --biz-deep:#144294; --biz-soft:#E2ECFA; --biz-text:#1D58BD;
  --amber-bg:#FFF4DA; --amber-ink:#7D5109; --star:#F2A20C; --danger:#C0392B;
  --o-bg:#FDEBD3; --o-ink:#B45F06; --r-bg:#FBE1DE; --r-ink:#C0392B; --v-bg:#E9E5FB; --v-ink:#5B45C8;
  --map-bg:#E8F0E9; --map-block:#D7E6DA; --map-park:#C9E3CF; --map-road:#FFFFFF; --map-route:#2F6FEB;
  --frame:#0D1512;
  --shadow:0 1px 2px rgba(14,34,23,.06),0 4px 14px rgba(14,34,23,.06);
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --page:#080D0A; --surface:#111A15; --surface-2:#18231D; --ink:#EAF3ED; --muted:#9AAAA1; --line:#25332A;
    --brand-soft:#173323; --brand-text:#5FD08D; --biz-soft:#15294A; --biz-text:#86B2FF;
    --amber-bg:#3A2C10; --amber-ink:#F1C56E;
    --o-bg:#3A2A12; --o-ink:#F2B15A; --r-bg:#3B1B18; --r-ink:#F08A7E; --v-bg:#26214A; --v-ink:#AFA2F5;
    --map-bg:#16211B; --map-block:#1D2C23; --map-park:#20382A; --map-road:#2A3A30; --map-route:#5B93FF;
    --frame:#000; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --page:#080D0A; --surface:#111A15; --surface-2:#18231D; --ink:#EAF3ED; --muted:#9AAAA1; --line:#25332A;
  --brand-soft:#173323; --brand-text:#5FD08D; --biz-soft:#15294A; --biz-text:#86B2FF;
  --amber-bg:#3A2C10; --amber-ink:#F1C56E;
  --o-bg:#3A2A12; --o-ink:#F2B15A; --r-bg:#3B1B18; --r-ink:#F08A7E; --v-bg:#26214A; --v-ink:#AFA2F5;
  --map-bg:#16211B; --map-block:#1D2C23; --map-park:#20382A; --map-road:#2A3A30; --map-route:#5B93FF;
  --frame:#000; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--page);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent-text,var(--brand-text));outline-offset:2px}
h1,h2,h3,p{margin:0}
.ic{flex:none;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- stage + phone ---------- */
.stage{height:100%;display:flex;align-items:center;justify-content:center}
.phone{
  --accent:var(--brand);--accent-deep:var(--brand-deep);--accent-soft:var(--brand-soft);--accent-text:var(--brand-text);
  position:relative;width:100%;height:100%;background:var(--surface);overflow:hidden;display:flex;flex-direction:column;
}
.phone[data-mode="business"]{--accent:var(--biz);--accent-deep:var(--biz-deep);--accent-soft:var(--biz-soft);--accent-text:var(--biz-text)}
.status{display:none;flex:none;justify-content:space-between;align-items:center;padding:14px 30px 6px;font-weight:700;font-size:14px}
.status span:last-child{display:flex;gap:5px;align-items:center}
@media (min-width:520px){
  .phone{width:392px;height:min(844px,calc(100% - 32px));border-radius:48px;border:9px solid var(--frame);box-shadow:0 30px 60px -20px rgba(0,0,0,.4)}
  .phone::after{content:"";position:absolute;top:9px;left:50%;width:92px;height:26px;margin-left:-46px;border-radius:20px;background:var(--frame);z-index:60}
  .status{display:flex}
}
.views{position:relative;flex:1;overflow:hidden}
.screen{
  position:absolute;inset:0;display:flex;flex-direction:column;background:var(--surface);
  transform:translateX(100%);opacity:0;visibility:hidden;
  transition:transform .3s cubic-bezier(.2,.7,.2,1),opacity .3s,visibility 0s linear .3s;
}
.screen.active{transform:none;opacity:1;visibility:visible;transition-delay:0s}
.screen.left{transform:translateX(-22%);opacity:0}
.views.instant .screen{transition:none}
.tabscreen{--accent:var(--brand);--accent-deep:var(--brand-deep);--accent-soft:var(--brand-soft);--accent-text:var(--brand-text)}

/* ---------- shared bits ---------- */
.hdr{display:grid;grid-template-columns:44px 1fr 56px;align-items:center;padding:4px 10px;min-height:52px;flex:none}
.hdr h1{font-size:16px;font-weight:700;text-align:center}
.hdr .link{justify-self:end;font-weight:700;color:var(--accent-text);font-size:13px;padding:10px 8px}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.iconbtn:active{background:var(--surface-2)}
.body{flex:1;overflow-y:auto;padding:4px 18px 22px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.foot{flex:none;padding:12px 18px;border-top:1px solid var(--line);background:var(--surface)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 16px;border-radius:12px;font-weight:700;font-size:15px;text-align:center}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);color:#fff}
.btn-outline{border:1.5px solid var(--accent);color:var(--accent-text)}
.btn-soft{background:var(--surface-2);border:1px solid var(--line)}
.btn-block{display:flex;width:100%}
.btn-sm{height:38px;font-size:13.5px;border-radius:10px;padding:0 18px}
.btn:disabled{opacity:.65}
.lbl{font-size:13px;font-weight:700;margin:20px 0 8px}
.lbl small{font-weight:500;color:var(--muted);font-size:12.5px}
.card{border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--surface)}
.muted{color:var(--muted)}
.demo{display:block;margin:10px auto 0;padding:6px 14px;border:1px dashed var(--line);border-radius:999px;font-size:12px;color:var(--muted)}
.av{border-radius:50%;overflow:hidden;flex:none;display:block}
.toast{position:absolute;left:50%;bottom:92px;transform:translate(-50%,10px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:70;max-width:88%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.sheet-wrap{position:absolute;inset:0;z-index:50;display:flex;align-items:flex-end;background:rgba(6,14,10,.5);opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s linear .2s}
.sheet-wrap.on{opacity:1;visibility:visible;transition-delay:0s}
.sheet{width:100%;max-height:84%;overflow:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:16px 18px 24px;transform:translateY(24px);transition:transform .25s}
.sheet-wrap.on .sheet{transform:none}
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sheet-h b{font-size:17px;font-weight:800}
.sheet p{color:var(--muted);font-size:14px;margin-bottom:14px}
.sheet .btn{margin-top:6px}

/* ---------- tab bar ---------- */
.tabbar{flex:none;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--surface);padding:6px 6px 8px}
.tb{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 0}
.tb[aria-current="page"]{color:var(--brand-text)}

/* ---------- home ---------- */
.home-top{display:flex;align-items:center;justify-content:space-between;padding:6px 0 0}
.logo{display:flex;align-items:center;gap:8px}
.logo>div{display:flex;flex-direction:column}
.logo b{font-size:26px;font-weight:800;color:var(--brand-text);letter-spacing:-.02em;line-height:1.1}
.logo span{font-size:11.5px;color:var(--brand-text);font-weight:500}
.hero{display:grid;grid-template-columns:1fr 112px;align-items:end;gap:4px;margin:16px 0 14px}
.hero h1{font-size:30px;line-height:1.06;font-weight:800;letter-spacing:-.035em}
.hero h1 span{color:var(--brand-text);display:block}
.hero p{margin-top:10px;font-size:13px;color:var(--muted);max-width:200px}
.hero svg{width:100%;height:auto}
.live{display:flex;align-items:center;gap:12px;width:100%;padding:12px;margin-bottom:14px;border-radius:16px;background:var(--brand-soft);border:1px solid var(--brand)}
.live b{display:block;font-size:14px}
.live span.s{display:block;font-size:12.5px;color:var(--muted)}
.live .go{margin-left:auto;font-weight:700;color:var(--brand-text);font-size:13px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:14px 12px 12px;border-radius:20px;border:1px solid var(--line);text-align:left}
.mode>span{display:block}
.mode.p{background:var(--brand-soft)}
.mode.b{background:var(--biz-soft)}
.mode .art{position:relative;width:64px;height:64px;margin-bottom:4px}
.mode .art .bdg{position:absolute;right:-8px;bottom:-4px;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:#fff;border:2px solid var(--surface)}
.mode.p .bdg{background:var(--brand)}
.mode.b .bdg{background:var(--biz)}
.mode .t{font-size:18px;font-weight:800;letter-spacing:-.02em}
.mode.p .t{color:var(--brand-text)}
.mode.b .t{color:var(--biz-text)}
.mode .d{font-size:12px;color:var(--muted);line-height:1.35;min-height:32px}
.mode .cta{align-self:stretch;height:38px;margin-top:6px;border-radius:10px;color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px}
.mode.p .cta{background:var(--brand)}
.mode.b .cta{background:var(--biz)}
.mode:active{transform:scale(.985)}
.feats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:18px 0 14px}
.ft{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11.5px;font-weight:600;text-align:center;line-height:1.25;padding:4px 0}
.ft>span:first-child{width:46px;height:46px;border-radius:14px;display:grid;place-items:center}
.f1>span:first-child{background:var(--brand-soft);color:var(--brand-text)}
.f2>span:first-child{background:var(--o-bg);color:var(--o-ink)}
.f3>span:first-child{background:var(--r-bg);color:var(--r-ink)}
.f4>span:first-child{background:var(--v-bg);color:var(--v-ink)}
.banner{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--brand-soft);color:var(--brand-text)}
.banner b{display:block;font-size:13px;color:var(--ink)}
.banner span{font-size:12px;color:var(--muted)}

/* ---------- create ---------- */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px;background:var(--surface-2);border-radius:14px;border:1px solid var(--line);margin-top:6px}
.seg button{height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.q{font-size:23px;font-weight:800;letter-spacing:-.025em;line-height:1.15;margin:20px 0 10px}
.field{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;min-height:48px;background:var(--surface)}
.field:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field input,.field textarea{flex:1;min-width:0;width:100%;border:0;outline:0;background:transparent;font:inherit;color:inherit;padding:12px 0}
.field input::placeholder,.field textarea::placeholder{color:var(--muted);opacity:.8}
.field.ta{flex-direction:column;align-items:stretch;gap:4px;padding:10px 12px}
.field.ta textarea{min-height:92px;resize:none;padding:0;line-height:1.45}
.speak{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:10px;background:var(--accent-soft);color:var(--accent-text);font-weight:700;font-size:12.5px}
.err{color:var(--danger);font-size:12.5px;font-weight:600;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{padding:7px 12px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;font-weight:600;background:var(--surface-2)}
.chip:active{border-color:var(--accent);color:var(--accent-text)}
.tg{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px}
.tg b{display:block;font-size:13.5px}
.tg small{color:var(--muted);font-size:12px}
.tg input{appearance:none;-webkit-appearance:none;flex:none;width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;transition:background .2s;margin:0}
.tg input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.tg input:checked{background:var(--accent)}
.tg input:checked::after{transform:translateX(18px)}
.photos{display:flex;gap:10px;flex-wrap:wrap}
.addph{width:72px;height:72px;border:1.5px dashed var(--muted);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;color:var(--muted);font-weight:600}
.ph{position:relative;width:72px;height:72px;border-radius:12px;overflow:hidden}
.ph .x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.68);color:#fff;display:grid;place-items:center}
.pt{width:100%;height:100%;display:grid;place-items:center}
.pt0{background:#CDE5D4;color:#2F6B45}
.pt1{background:#E9DDC6;color:#7A5A22}
.pt2{background:#C9D9F0;color:#2F5A9A}
.loc-t{flex:1;min-width:0;padding:9px 0;line-height:1.3}
.loc-t small{display:block;font-size:11.5px;color:var(--muted)}
.loc-t b{font-size:13.5px}
.two{display:grid;grid-template-columns:1.25fr 1fr;gap:10px}
.two input{font-size:13.5px}
.rup{font-weight:700;color:var(--muted);font-size:16px}
input[type="date"],input[type="time"]{color-scheme:light dark;min-height:24px}

/* ---------- finding ---------- */
.find-body{display:flex;flex-direction:column;align-items:center;text-align:center}
.radar{position:relative;width:230px;height:230px;margin:14px 0 20px}
.radar .ring{position:absolute;inset:0;border-radius:50%;background:var(--accent-soft);opacity:.9}
.radar .r2{inset:22px;background:var(--surface);opacity:.55}
.radar .r3{inset:44px;background:var(--accent-soft)}
.radar .pulse{position:absolute;inset:0;border-radius:50%;border:2px solid var(--accent);opacity:0;animation:pulse 2.4s ease-out infinite}
.radar .pulse.two{animation-delay:1.2s}
.radar .lens{position:absolute;left:50%;top:50%;width:92px;height:92px;margin:-46px 0 0 -46px;border-radius:50%;background:var(--surface);border:5px solid var(--accent);display:grid;place-items:center;color:var(--accent-text)}
.radar .pin{position:absolute;color:var(--accent-text);background:var(--surface);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;box-shadow:var(--shadow)}
.find-body h2{font-size:24px;font-weight:800;letter-spacing:-.025em;line-height:1.15}
.find-body p{color:var(--muted);margin:8px 0 18px}
.checks{list-style:none;margin:0 0 18px;padding:0 6px;width:100%;text-align:left;display:flex;flex-direction:column;gap:12px}
.checks li{display:flex;align-items:center;gap:12px;font-weight:600;color:var(--muted)}
.checks li.now,.checks li.done{color:var(--ink)}
.ck{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none;border:2px solid var(--line);color:#fff}
.checks li.done .ck{background:var(--brand);border-color:var(--brand)}
.checks li.now .ck{border-color:var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
.trust{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--amber-bg);color:var(--amber-ink);border-radius:14px;padding:12px 14px;font-weight:600;font-size:13px}

/* ---------- helpers list ---------- */
.sortbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 18px 10px;font-size:12.5px;flex:none}
.sortbar .loc{display:flex;align-items:center;gap:4px;color:var(--muted);font-weight:600}
.sort{display:flex;align-items:center;gap:6px;color:var(--muted)}
.sort select{font:inherit;font-weight:700;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.hc{border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:12px;background:var(--surface);box-shadow:var(--shadow)}
.hc-main{display:flex;gap:12px;width:100%}
.av-wrap{position:relative;flex:none;height:52px}
.dot{position:absolute;right:-2px;top:0;width:13px;height:13px;border-radius:50%;background:#22C55E;border:2.5px solid var(--surface)}
.hc-info{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.hc-info>*{display:block}
.hc-name{font-size:15px;font-weight:800}
.hc-rate{display:flex!important;align-items:center;gap:4px;font-size:12.5px}
.hc-role{font-size:12.5px;color:var(--muted)}
.hc-meta{display:flex!important;align-items:center;gap:5px;font-size:12.5px;color:var(--muted)}
.hc-price{font-size:13px;font-weight:700}
.hc-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.bd{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--brand-text);background:var(--brand-soft);padding:4px 8px;border-radius:8px}
.note{text-align:center;color:var(--muted);font-size:12px;padding:2px 0 6px}

/* ---------- profile ---------- */
.p-top{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:3}
.p-top .iconbtn{background:rgba(255,255,255,.92);color:#0E2217;box-shadow:var(--shadow)}
.p-hero{position:relative;height:250px;flex:none;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.p-hero .av{border-radius:0;width:250px;height:250px}
.online{position:absolute;right:16px;bottom:34px;display:inline-flex;align-items:center;gap:6px;background:var(--surface);color:var(--brand-text);font-weight:700;font-size:12px;padding:5px 10px;border-radius:999px;box-shadow:var(--shadow)}
.online i{width:8px;height:8px;border-radius:50%;background:#22C55E}
.p-card{position:relative;margin-top:-24px;background:var(--surface);border-radius:24px 24px 0 0;padding:18px 18px 8px}
.p-card h2{font-size:23px;font-weight:800;letter-spacing:-.025em}
.rate-row{display:flex;align-items:center;gap:5px;margin-top:4px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:14px;margin:14px 0}
.stats div{text-align:center;padding:10px 4px}
.stats div+div{border-left:1px solid var(--line)}
.stats b{display:block;font-size:17px;font-weight:800}
.stats span{font-size:11px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag2{border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-size:12.5px;font-weight:600;background:var(--surface-2)}
.bd-lg{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--brand-text);border:1px solid var(--brand);border-radius:10px;padding:6px 10px}
.about{color:var(--muted);line-height:1.5}
.rev{display:flex;gap:10px;align-items:flex-start;padding:10px 0}
.rev .ini{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;font-weight:800;flex:none}
.rev b{font-size:13.5px}
.rev small{color:var(--muted);float:right;font-size:11.5px}
.rev p{font-size:13px;color:var(--muted)}
.rowb{display:flex;align-items:center;justify-content:space-between}
.rowb .lnk{color:var(--accent-text);font-weight:700;font-size:12.5px}

/* ---------- confirm ---------- */
.sec{display:flex;align-items:center;justify-content:space-between;margin:18px 0 8px}
.sec h3{font-size:15px;font-weight:800}
.sec .link{color:var(--accent-text);font-weight:700;font-size:13px}
.drow{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:13.5px}
.drow .ic{color:var(--muted);margin-top:1px}
.drow .rup{width:20px;text-align:center;line-height:1.2;margin-top:0;font-size:15px}
.hrow{display:flex;align-items:center;gap:12px}
.hrow b{display:block;font-size:15px}
.amt{font-size:28px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;padding:14px;border:1.5px solid var(--line);border-radius:14px;margin-bottom:10px}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt b{display:block;font-size:14px}
.opt small{color:var(--muted);font-size:12.5px}
.rd{width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);flex:none;margin-top:1px}
.opt[aria-checked="true"] .rd{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 4px var(--surface)}

/* ---------- tracking ---------- */
.steps{display:flex;padding:6px 10px 6px;flex:none}
.st{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;font-size:10.5px;font-weight:600;color:var(--muted);text-align:center}
.st::before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:2px;background:var(--line)}
.st:first-child::before{display:none}
.st.done::before,.st.now::before{background:var(--accent)}
.st i{position:relative;z-index:1;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line);color:var(--muted)}
.st.done i{background:var(--accent);border-color:var(--accent);color:#fff}
.st.now i{border-color:var(--accent);color:var(--accent-text);box-shadow:0 0 0 4px var(--accent-soft)}
.st.done,.st.now{color:var(--ink)}
.status-card{display:flex;align-items:center;gap:14px;background:var(--accent-soft);border-radius:16px;padding:12px 14px;margin:8px 18px;flex:none}
.status-card .sic{width:44px;height:44px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.status-card b{display:block;font-size:16px;font-weight:800}
.status-card span{color:var(--accent-text);font-weight:600;font-size:13.5px}
.map{position:relative;flex:1;min-height:170px;overflow:hidden}
.map-svg{position:absolute;inset:0;width:100%;height:100%}
.map-svg text{font-family:var(--font)}
.map-svg .mv{transition:transform .7s linear}
.bubble{position:absolute;right:12px;top:12px;background:var(--surface);border-radius:12px;padding:8px 12px;box-shadow:var(--shadow);font-size:12.5px;font-weight:600;line-height:1.3}
.bubble small{display:block;color:var(--muted);font-weight:500}
.panel{flex:none;position:relative;background:var(--surface);border-radius:22px 22px 0 0;margin-top:-18px;padding:14px 18px 12px;box-shadow:0 -6px 20px rgba(0,0,0,.08)}
.panel .hrow small{color:var(--muted);font-size:12.5px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.live-note{display:flex;align-items:center;gap:8px;margin-top:12px;padding:9px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font-size:12px;color:var(--muted)}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.metrics div{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.metrics b{display:block;color:var(--ink);font-size:15px;font-weight:800}
.metrics .ic{color:var(--ink)}
.curstat{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);margin-bottom:12px}
.curstat b{display:block;color:var(--ink);font-size:15px}

/* ---------- otp ---------- */
.otp-body{display:flex;flex-direction:column;align-items:center;text-align:center}
.otp-art{position:relative;display:flex;align-items:center;justify-content:center;gap:0;width:100%;padding:16px 0 8px}
.otp-art::before{content:"";position:absolute;inset:6px 4px;background:var(--accent-soft);border-radius:60px 60px 40px 40px}
.otp-art>*{position:relative}
.otp-art .mid{width:74px;height:110px;margin:0 -6px;border-radius:16px;background:var(--surface);border:3px solid var(--ink);display:grid;place-items:center;color:var(--accent-text);z-index:2}
.otp-body h2{font-size:16px;font-weight:600;color:var(--muted);margin:20px 0 16px;max-width:260px;line-height:1.4}
.otp{display:flex;gap:8px;justify-content:center;margin-bottom:22px}
.otp span{width:44px;height:56px;border:1.5px solid var(--line);border-radius:10px;display:grid;place-items:center;font-size:26px;font-weight:800;background:var(--surface);box-shadow:var(--shadow)}
.lockrow{display:flex;gap:12px;align-items:center;text-align:left;font-size:13px;color:var(--muted);padding:0 4px;margin-bottom:16px}
.warn{display:flex;gap:10px;text-align:left;background:var(--amber-bg);color:var(--amber-ink);border-radius:14px;padding:12px 14px;font-size:13px;width:100%}
.warn b{display:block;color:var(--ink)}
.help-l{color:var(--accent-text);font-weight:700;margin-top:16px;padding:8px}

/* ---------- done ---------- */
.done-top{text-align:center;padding-top:6px}
.burst{position:relative;width:100px;height:100px;margin:4px auto 6px}
.tick{position:absolute;inset:10px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;animation:pop .55s cubic-bezier(.2,1.4,.4,1)}
.bdot{position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3px;border-radius:50%;background:var(--c);transform:rotate(var(--a)) translateY(-48px);animation:burst .8s ease-out}
.done-top h2{font-size:26px;font-weight:800;letter-spacing:-.025em}
.done-top p{color:var(--muted);margin-top:2px}
.tri{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:14px;margin:16px 0 14px}
.tri div{text-align:center;padding:10px 4px}
.tri div+div{border-left:1px solid var(--line)}
.tri span{display:block;font-size:11px;color:var(--muted)}
.tri b{font-size:17px;font-weight:800}
.stars{display:flex;gap:8px;justify-content:center;margin:6px 0 12px}
.stars button{color:var(--line);padding:2px}
.stars button.on{color:var(--star)}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.rated{color:var(--brand-text);font-weight:700;text-align:center}

.donebar{display:flex;align-items:center;justify-content:space-between;background:var(--brand-soft);color:var(--brand-text);border-radius:12px;padding:10px 14px;font-weight:700}
.donebar span{display:flex;align-items:center;gap:8px}
.donebar small{color:var(--muted);font-weight:500}
.kv{display:flex;justify-content:space-between;gap:16px;padding:9px 0;font-size:13.5px;border-bottom:1px solid var(--line)}
.kv dt{color:var(--muted);margin:0;flex:none}
.kv dd{margin:0;font-weight:700;text-align:right}
dl{margin:0}
.round{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--brand);color:var(--brand-text);display:grid;place-items:center}
.thumbs{display:flex;gap:10px}
.thumbs>*{width:72px;height:72px;border-radius:12px;overflow:hidden}
.more{background:#1c2a22;color:#fff;display:grid;place-items:center;font-weight:800;font-size:16px}

.tk{display:flex;align-items:center;gap:12px;width:100%;padding:12px;margin-bottom:10px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.tk .ti{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.tk .ti.p{background:var(--brand-soft);color:var(--brand-text)}
.tk .ti.b{background:var(--biz-soft);color:var(--biz-text)}
.tk div{flex:1;min-width:0}
.tk b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk small{color:var(--muted);font-size:12px}
.tk .a{font-weight:800}
details{border:1px solid var(--line);border-radius:14px;padding:0 14px;margin-bottom:10px}
summary{cursor:pointer;padding:14px 0;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:20px;color:var(--muted)}
details[open] summary::after{content:"-"}
details p{color:var(--muted);padding-bottom:14px}
.who{display:flex;align-items:center;gap:14px;padding:6px 0 10px}
.who b{font-size:19px;display:block}
.who span{color:var(--muted)}
.menu{display:flex;align-items:center;gap:12px;width:100%;padding:14px 0;border-bottom:1px solid var(--line);font-weight:600}
.menu small{display:block;color:var(--muted);font-weight:500;font-size:12.5px}
.menu .ic:last-child{margin-left:auto;color:var(--muted)}
.menu>span{flex:1}

/* ---------- chat ---------- */
.chat{display:flex;flex-direction:column;gap:8px;min-height:180px;max-height:300px;overflow:auto;padding:4px 0 8px}
.msg{max-width:80%;padding:9px 12px;border-radius:14px;font-size:13.5px;line-height:1.35}
.msg.them{background:var(--surface-2);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--accent);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.chat-in{display:flex;gap:8px;margin-top:6px}
.chat-in .field{flex:1;min-height:44px}
.chat-in .btn{width:46px;padding:0;margin:0}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%{transform:scale(.4);opacity:.7}100%{transform:scale(1);opacity:0}}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes burst{0%{opacity:1;transform:rotate(var(--a)) translateY(-20px)}100%{opacity:0;transform:rotate(var(--a)) translateY(-56px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

var timers=[];
function later(fn,ms){var t=setTimeout(fn,ms);timers.push(t);return t}

function clearTimers(){timers.forEach(function(t){clearTimeout(t);clearInterval(t)});timers=[]}
function scr(id){return $('#s-'+id)}
function setState(el,st){el.classList.toggle('active',st==='active');el.classList.toggle('left',st==='left')}
var R={};
function enter(id){clearTimers();if(R[id])R[id]()}
function top(){return S.stack[S.stack.length-1]}
function go(id){var cur=top();if(cur===id)return;S.stack.push(id);enter(id);setState(scr(cur),'left');setState(scr(id),'active')}
function swap(id){var cur=S.stack.pop();S.stack.push(id);enter(id);setState(scr(cur),'left');setState(scr(id),'active')}
function back(){
  if(S.stack.length<2){tab('home');return}
  clearTimers();var cur=S.stack.pop();setState(scr(cur),'');var t=top();
  if(t==='home'||t==='tasks')enter(t);
  setState(scr(t),'active');
}
function popTo(id){
  clearTimers();
  while(S.stack.length>1&&top()!==id){setState(scr(S.stack.pop()),'')}
  setState(scr(top()),'active');
}
function tab(name){
  clearTimers();var v=$('#views');v.classList.add('instant');
  S.stack=[name];
  $$('.screen').forEach(function(s){setState(s,'')});
  enter(name);setState(scr(name),'active');
  void v.offsetWidth;requestAnimationFrame(function(){v.classList.remove('instant')});
}

var INFO={
 verified:['Verified Helpers','Every helper submits a government ID and passes a background check before they can accept tasks.'],
 local:['Local Support','Our team in Warangal is on call every day, 8 AM to 10 PM, to help with any task.'],
 updates:['On-Time Updates','Track your helper live and get an update at each step: on the way, reached, in progress and done.'],
 photos:['Photos & Reports','Helpers add photos and a short report so you can see the work was done.']
};

/* ---------- actions ---------- */
var A={
 start:function(el){
   if(S.run&&S.run.stage==='done'){S.task.desc='';S.task.photos=[];S.task.bizName='';S.task.gst=false;S.task.budget='';S.run=null}
   setMode(el.dataset.mode);go('create')
 },
 tab:function(el){tab(el.dataset.tab)},
 back:function(){back()},
 home:function(){tab('home')},
 setmode:function(el){if(S.mode===el.dataset.mode)return;setMode(el.dataset.mode);keepScroll(R.create)},
 chip:function(el){var c=CHIPS[S.mode][+el.dataset.i];S.task.desc=c[1];keepScroll(R.create);$('#descErr').hidden=true},
 speak:function(){
   toast('Listening\u2026');
   setTimeout(function(){
     var s=S.mode==='business'?'Collect signed invoices from our vendor and bring them to our office.':'Pick up medicine from Apollo Pharmacy and deliver it to my home.';
     S.task.desc=S.task.desc.trim()?S.task.desc.trim()+' '+s:s;keepScroll(R.create);toast('Added what you said');
   },1400);
 },
 addphoto:function(){if(S.task.photos.length<3){S.task.photos.push(S.task.photos.length);keepScroll(R.create)}},
 rmphoto:function(el){S.task.photos.splice(+el.dataset.i,1);keepScroll(R.create)},
 loc:function(){toast('Location set to '+S.task.loc)},
 find:function(){
   if(!S.task.desc.trim()){var e=$('#descErr');e.hidden=false;$('#desc').focus();return}
   go('finding');
 },
 profile:function(el){S.helper=HELPERS[S.mode].filter(function(h){return h.id===el.dataset.id})[0];go('profile')},
 selecthelper:function(){go('confirm')},
 share:function(){toast('Profile link copied')},
 seeall:function(){toast('More reviews coming soon')},
 edit:function(){popTo('create')},
 pay:function(el){S.pay=el.dataset.v;$$('#s-confirm .opt').forEach(function(o){o.setAttribute('aria-checked',String(o.dataset.v===S.pay))})},
 confirm:function(){
   var h=S.helper;
   S.run={stage:'track1',eta:h.eta,etaStart:h.eta,elapsed:0,otp:String(Math.floor(100000+Math.random()*900000)),taskId:String(Math.floor(10000+Math.random()*90000))};
   toast(h.name.split(' ')[0]+' is on the way');
   S.stack=['home'];$$('.screen').forEach(function(s){if(s.id!=='s-confirm'&&s.id!=='s-home')setState(s,'')});
   var cur=scr('confirm');S.stack=['home','track1'];R.home();enter('track1');setState(cur,'left');setState(scr('track1'),'active');setState(scr('home'),'');
 },
 resume:function(){if(S.run){var st=S.run.stage;S.stack=[S.stack[0]];go(st)}},
 skip1:function(){S.run.eta=0;arrive()},
 verify:function(){S.run.stage='track2';S.run.startAt=new Date();S.run.elapsed=0;swap('track2')},
 skip2:function(){S.run.elapsed=TOTAL_MIN;complete()},
 star:function(el){S.rating=+el.dataset.n;paintStars()},
 submit:function(){
   if(!S.rating){toast('Tap a star to rate');return}
   var txt=$('#rv').value.trim();S.review={rating:S.rating,text:txt};
   $('#rv').disabled=true;var b=$('#subrev');b.disabled=true;b.textContent='Review submitted';toast('Thanks for your review');
 },
 again:function(){var m=S.mode;S.run=null;tab('home');setMode(m);go('create')},
 details:function(){go('details')},
 call:function(){toast('Calling '+S.helper.name.split(' ')[0]+'\u2026')},
 chat:function(){openChat('helper')},
 callsupport:function(){toast('Calling Sahayakh Support\u2026')},
 chatsupport:function(){openChat('support')},
 send:sendMsg,
 help:function(){sheet('Need help?','<p>Talk to Sahayakh Support about this task. We can reach your helper or assign a new one.</p><button class="btn btn-primary btn-block" style="background:var(--brand)" data-act="callsupport">'+I('phone',18)+'Call support</button><button class="btn btn-outline btn-block" style="border-color:var(--brand);color:var(--brand-text)" data-act="chatsupport">'+I('chat',18)+'Chat with support</button>')},
 info:function(el){var i=INFO[el.dataset.k];sheet(i[0],'<p>'+i[1]+'</p><button class="btn btn-primary btn-block" style="background:var(--brand)" data-act="closesheet">Got it</button>')},
 bell:function(){sheet('Notifications','<p>No new notifications. Updates about your helper and tasks will show up here.</p><button class="btn btn-primary btn-block" style="background:var(--brand)" data-act="closesheet">Got it</button>')},
 soon:function(){toast('Not part of this prototype yet')},
 closesheet:closeSheet
};
document.addEventListener('click',function(e){
  var w=$('#sheet');if(e.target===w){closeSheet();return}
  var el=e.target.closest('[data-act]');if(!el)return;
  var f=A[el.dataset.act];if(f)f(el);
});
document.addEventListener('input',function(e){
  var t=e.target,b=t.dataset&&t.dataset.bind;
  if(b){
    if(b==='budget'){var v=t.value.replace(/[^0-9\s\-\u2013]/g,'');if(v!==t.value)t.value=v}
    S.task[b]=t.type==='checkbox'?t.checked:t.value;
    if(b==='desc'&&t.value.trim()){var er=$('#descErr');if(er)er.hidden=true}
  }
});
document.addEventListener('change',function(e){
  if(e.target.id==='sort'){S.sort=e.target.value;paintHelpers()}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape')closeSheet();
  if(e.key==='Enter'&&e.target.id==='chatIn'){e.preventDefault();sendMsg()}
});

enter('home');
window.__S=S;window.__A=A;
})();
</script>
</body>
</html>
